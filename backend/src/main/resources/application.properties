spring.application.name=mini-trading-desk

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/trading}
spring.datasource.username=${DB_USER:trading}
spring.datasource.password=${DB_PASSWORD:trading}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Prices: "simulator" (default) or "mt5" (Phase 14)
price.source=${PRICE_SOURCE:simulator}
price.simulator.interval-ms=2000