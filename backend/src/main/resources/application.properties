spring.application.name=mini-trading-desk

# Database. ${ENV_VAR:default} reads an environment variable, falling back to the local default.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/trading}
spring.datasource.username=${DB_USER:trading}
spring.datasource.password=${DB_PASSWORD:trading}

# JPA: Flyway owns the schema; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading in controllers/JSON serialisation: services return DTOs.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always